services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend:/app:ro
      - ./frontend:/frontend:ro
      - ./data:/data:ro
      - ./LICENSE:/LICENSE:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: postgresql://postgres:secret@postgres:5432/MKS_db
    depends_on:
      postgres:
        condition: service_healthy
    command: ["flask", "--app", "app", "run", "--debug", "--host=0.0.0.0"]

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: MKS_db
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/mechanical_switches_setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15

  pgadmin:
    profiles: ["dev"]
    image: dpage/pgadmin4:9.8
    ports:
      - "127.0.0.1:5050:80"
    environment:
      # Required by pgAdmin
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret

      # Don't require the user to login
      PGADMIN_CONFIG_SERVER_MODE: 'False'

      # Don't require a "master" password after logging in
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'

volumes:
  postgres_data:
