<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mechanical Keyboard Switches</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="js/datatable.js" defer></script>
</head>
<body>
  <h1>Mechanical Keyboard Switches</h1>
  <form id="filter-form">
    <label for="search">Search</label>
    <input id="search" name="search" type="search">
    <label for="attribute">Attribute</label>
    <select id="attribute" name="attribute">
      <option value="all">All attributes</option>
      <option value="brand">Brand</option>
      <option value="brand_country">Brand country</option>
      <option value="brand_website">Brand website</option>
      <option value="model">Model</option>
      <option value="switch_type">Switch type</option>
      <option value="actuation_force_g">Actuation force</option>
      <option value="bottom_out_force_g">Bottom-out force</option>
      <option value="pre_travel_mm">Pre-travel</option>
      <option value="total_travel_mm">Total travel</option>
      <option value="stem_material">Stem material</option>
      <option value="housing_material">Housing material</option>
      <option value="factory_lubed">Factory lubed (true/false)</option>
      <option value="purchase_links">Purchase links</option>
    </select>
    <button type="submit">Filter</button>
    <button type="reset">Clear</button>
  </form>
  <table>
    <thead>
      <tr>
        <th scope="col">Brand</th>
        <th scope="col">Brand country</th>
        <th scope="col">Brand website</th>
        <th scope="col">Model</th>
        <th scope="col">Switch type</th>
        <th scope="col">Actuation force (gf)</th>
        <th scope="col">Bottom-out force (gf)</th>
        <th scope="col">Pre-travel (mm)</th>
        <th scope="col">Total travel (mm)</th>
        <th scope="col">Stem material</th>
        <th scope="col">Housing material</th>
        <th scope="col">Factory lubed</th>
        <th scope="col">Purchase links</th>
      </tr>
    </thead>
    <tbody id="switches"></tbody>
  </table>
  <p id="status" role="status"></p>
</body>
</html>
